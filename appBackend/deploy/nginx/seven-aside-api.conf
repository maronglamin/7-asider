# Nginx config for 7-aside backend API (seven-aside.phantommetrics.gm)
# Backend must be running on port 4000 (e.g. Node with PORT=4000).
#
# Security: see deploy/SERVER-SECURITY.md for rate limits, Fail2Ban, and headers.

# Rate limit zone — add once in /etc/nginx/nginx.conf inside http { }:
#   limit_req_zone $binary_remote_addr zone=7aside_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name seven-aside.phantommetrics.gm;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location /auth/ {
        # Enable after adding to /etc/nginx/nginx.conf http { }:
        #   limit_req_zone $binary_remote_addr zone=7aside_auth:10m rate=10r/m;
        # limit_req zone=7aside_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

