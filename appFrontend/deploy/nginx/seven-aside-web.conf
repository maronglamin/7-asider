# Nginx config for 7a-side web frontend (7a-side.phantommetrics.gm)
# Build the frontend with `npm run build:web` and copy appFrontend/dist to /var/www/7-aside/appFrontend.

server {
    listen 80;
    listen [::]:80;
    server_name 7a-side.phantommetrics.gm;

    root /var/www/7-aside/appFrontend;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

