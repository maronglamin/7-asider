# Nginx config for 7a-side admin portal (admin.7a-side.phantommetrics.gm)
# Build the SPA in /var/www/7-aside/appAdmin; Nginx serves dist/ and proxies API paths to the backend.
# Companion sites:
#   - API:      seven-aside.phantommetrics.gm  → :4000
#   - Consumer: 7a-side.phantommetrics.gm     → appFrontend/dist

server {
    listen 80;
    listen [::]:80;
    server_name admin.7a-side.phantommetrics.gm;

    root /var/www/7-asider/appAdmin/dist;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Admin API + auth (same paths the Vite proxy uses in local dev)
    location /admin/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Uploaded field images / KYC assets used by the portal
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite hashed assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — missing build returns 404, not an infinite index.html loop
    location / {
        try_files $uri $uri/ @spa_fallback;
    }

    location @spa_fallback {
        root /var/www/7-aside/appAdmin/dist;
        try_files /index.html =404;
    }
}

